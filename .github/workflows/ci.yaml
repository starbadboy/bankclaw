name: ci

on:
  pull_request:
  push:
    branches: main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pdftotext
        uses: daaku/gh-action-apt-install@v4
        with:
          packages: build-essential libpoppler-cpp-dev pkg-config

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install StatementSensei dependencies
        run: |
          uv venv --python 3.12
          uv sync --frozen --group dev

      - name: Check source package and dependency consistency
        run: |
          uv lock --check
          uv run --frozen python .github/scripts/check_release_artifacts.py

      - name: Run CI
        run: |
          uv run pytest .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dashboard tests + JSX check
        run: |
          npm ci
          npm test
          npm run jsx-check
